# Index de recherche du corpus (Pagefind), régénéré à chaque publication.
# Le commit de l'index porte [skip ci] : il ne relance pas les workflows ; Cloudflare le publie.
name: Index de recherche
on:
  push:
    branches: [main]
    paths-ignore: ['pagefind/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: recherche, cancel-in-progress: true }
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Construire l'index
        run: npx -y pagefind@1.3.0 --site . --root-selector main --glob "{index.html,sujets/**/*.html,bio/**/*.html,bibliotheque-des-documents/**/*.html,contradictions/**/*.html,arc/**/*.html,en/**/*.html,pt/**/*.html}"
      - name: Publier l'index
        run: |
          git config user.name "Filipe Bastos"
          git config user.email "filipebastos2024@gmail.com"
          git add pagefind
          git diff --cached --quiet && exit 0
          git commit -m "Index de recherche régénéré [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
