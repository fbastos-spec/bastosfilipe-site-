# Publie le site sur Cloudflare Pages à chaque commit sur main.
# Secrets à créer dans le dépôt (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN   jeton Cloudflare, permission « Cloudflare Pages : Edit » sur le compte
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare (tableau de bord, colonne de droite)
# Le projet Pages doit exister dans Cloudflare sous le nom ci-dessous (créé en « Direct Upload »).
name: Déploiement Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le dossier publié (sans les fichiers de travail)
        run: |
          mkdir -p /tmp/public
          rsync -a --exclude '.git' --exclude '.github' --exclude '_travail' --exclude 'README.md' ./ /tmp/public/
      - name: Vérifier la présence des deux secrets (sans les afficher)
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=1
          [ -n "$T" ] && echo "::notice::CLOUDFLARE_API_TOKEN présent (${#T} caractères)" || { echo "::error title=Secret manquant::CLOUDFLARE_API_TOKEN est vide ou absent des secrets Actions du dépôt"; ok=0; }
          [ -n "$A" ] && echo "::notice::CLOUDFLARE_ACCOUNT_ID présent (${#A} caractères)" || { echo "::error title=Secret manquant::CLOUDFLARE_ACCOUNT_ID est vide ou absent des secrets Actions du dépôt"; ok=0; }
          [ "$ok" = 1 ] || exit 1
      - name: Déployer sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy --assets /tmp/public --name bastosfilipe-site --compatibility-date 2026-10-01 2>&1 | tee -a sortie.txt; then
            msg=$(sed 's/\x1b\[[0-9;]*m//g' sortie.txt | grep -v -i 'npm warn' | tail -c 2500 | tr '\n' ' ')
            echo "::error title=Déploiement Cloudflare::$msg"
            exit 1
          fi
          url=$(sed 's/\x1b\[[0-9;]*m//g' sortie.txt | grep -o 'https://[a-z0-9.-]*workers.dev' | tail -1)
          echo "::notice title=Site publié::$url"
