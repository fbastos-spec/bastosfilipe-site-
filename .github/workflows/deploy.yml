# Publie le site sur Cloudflare Pages à chaque commit sur main.
# Secrets à créer dans le dépôt (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN   jeton Cloudflare, permission « Cloudflare Pages : Edit » sur le compte
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare (tableau de bord, colonne de droite)
# Le projet Pages doit exister dans Cloudflare sous le nom ci-dessous (créé en « Direct Upload »).
name: Déploiement Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le dossier publié (sans les fichiers de travail)
        run: |
          mkdir -p /tmp/public
          rsync -a --exclude '.git' --exclude '.github' --exclude '_travail' --exclude 'README.md' ./ /tmp/public/
      - name: Déployer sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@3 pages project create bastosfilipe-site --production-branch=main 2>&1 | tee -a sortie.txt || true
          if ! npx --yes wrangler@3 pages deploy /tmp/public --project-name=bastosfilipe-site --branch=main --commit-dirty=true 2>&1 | tee -a sortie.txt; then
            msg=$(grep -v '^\s*$' sortie.txt | tail -c 900 | tr '\n' ' ')
            echo "::error title=Déploiement Cloudflare Pages::$msg"
            exit 1
          fi
          url=$(grep -o 'https://[a-z0-9.-]*pages.dev' sortie.txt | tail -1)
          echo "::notice title=Site publié::$url"
